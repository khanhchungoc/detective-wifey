name: Deploy Static Game to GitHub Pages

on:
  push:
    branches:
      - main
      - stg
    paths-ignore:
      - '.agent-artifacts/**'
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            artifact: site-main
          - branch: stg
            artifact: site-stg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build Bundle
        run: npm run build

      - name: Verify Offline Cache and Updates
        run: node --test scripts/pwa.test.mjs

      - name: Upload ${{ matrix.branch }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download main Build
        uses: actions/download-artifact@v4
        with:
          name: site-main
          path: _site

      - name: Download stg Build
        uses: actions/download-artifact@v4
        with:
          name: site-stg
          path: _site/stg

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
