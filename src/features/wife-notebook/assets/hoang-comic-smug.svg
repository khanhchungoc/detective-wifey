  <!-- Cold Steel Interrogation Table Foreground -->
  <rect x="10" y="216" width="220" height="24" fill="url(#table-smug)"/>
  <line x1="10" y1="216" x2="230" y2="216" stroke="#cbd5e1" stroke-width="2" opacity="0.65"/>
</svg>
