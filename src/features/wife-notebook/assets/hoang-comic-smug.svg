    <path d="M92 92 L110 93 Q102 98 92 92 Z" fill="#f8fafc" stroke="#05070c" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="102" cy="93.5" r="2.8" fill="#090d16"/>
    <line x1="90" y1="91" x2="111" y2="92" stroke="#05070c" stroke-width="3" stroke-linecap="round"/>

    <path d="M130 90 L149 88 Q141 96 130 90 Z" fill="#f8fafc" stroke="#05070c" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="140" cy="90.5" r="2.8" fill="#090d16"/>
    <line x1="129" y1="89" x2="150" y2="87" stroke="#05070c" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M120 88 L118 105 C118 108 124 109 127 106" stroke="#05070c" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Obnoxious Lopsided Mocking Smirk with Tooth Glint -->
    <path d="M101 121 C113 122 127 118 141 110 C139 121 127 127 110 124 Z" fill="#ffffff" stroke="#05070c" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M140 107 Q146 109 144 115" stroke="#05070c" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M97 119 Q95 123 99 125" stroke="#5c2d1c" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M114 130 Q122 132 129 129" stroke="#3a1d12" stroke-width="2" stroke-linecap="round"/>
