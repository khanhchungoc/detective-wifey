<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="shirt-smug" x1="120" y1="146" x2="120" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5bb2e6"/>
      <stop offset="52%" stop-color="#286d9c"/>
      <stop offset="100%" stop-color="#102d47"/>
    </linearGradient>
    <linearGradient id="skin-smug" x1="120" y1="50" x2="120" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecc098"/>
      <stop offset="56%" stop-color="#c47e54"/>
      <stop offset="100%" stop-color="#61331e"/>
    </linearGradient>
    <linearGradient id="hair-smug" x1="88" y1="32" x2="152" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c3b54"/>
      <stop offset="38%" stop-color="#101624"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="table-smug" x1="120" y1="214" x2="120" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#525f73"/>
      <stop offset="20%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#06090e"/>
