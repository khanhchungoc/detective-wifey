  <path d="M96 206 L112 208 M98 211 L114 212" stroke="#05070c" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Cocked Head (-4deg Arrogant Tilt) -->
  <g transform="rotate(-4 120 94)">
    <path d="M77 92 C71 92 69 105 74 112 C76 115 80 115 81 112" fill="#b57149" stroke="#05070c" stroke-width="3" stroke-linecap="round"/>
    <path d="M163 92 C169 92 171 105 166 112 C164 115 160 115 159 112" fill="#9c5c38" stroke="#05070c" stroke-width="3" stroke-linecap="round"/>

    <path d="M80 73 C80 51 98 43 120 43 C142 43 160 51 160 73 L158 109 C157 123 146 134 132 139 C124 142 116 142 108 139 C94 134 83 123 82 109 Z" fill="url(#skin-smug)" stroke="#05070c" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="120" cy="66" rx="25" ry="9" fill="#fef08a" opacity="0.28"/>
    <path d="M83 108 C86 123 99 133 120 137 C141 133 154 123 157 108 L156 116 C153 129 141 137 120 141 C99 137 87 129 84 116 Z" fill="#3a1d12" opacity="0.6"/>

