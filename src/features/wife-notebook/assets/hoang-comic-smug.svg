  <!-- Leaning-Back Cocky Shoulders -->
  <path d="M32 226 C38 178 65 156 96 150 L120 158 L146 148 C176 152 202 174 208 226 Z" fill="url(#shirt-smug)" stroke="#05070c" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M34 224 C42 188 62 170 84 162 L74 224 Z" fill="#091a2b" opacity="0.78"/>
  <path d="M206 224 C196 186 176 166 156 158 L168 224 Z" fill="#091a2b" opacity="0.78"/>
  <path d="M64 180 L78 198 M174 176 L160 194" stroke="#05070c" stroke-width="2" stroke-linecap="round"/>

  <!-- Neck Raised Arrogantly -->
  <path d="M101 124 L100 158 L120 170 L140 156 L139 124 Z" fill="url(#skin-smug)" stroke="#05070c" stroke-width="3"/>
  <path d="M101 128 Q121 150 139 127 L139 145 Q120 158 101 145 Z" fill="#2a140d" opacity="0.86"/>

  <!-- Collar & Pocket Sunglasses -->
  <path d="M95 148 L82 172 L108 177 L120 167 Z" fill="#6ec2f2" stroke="#05070c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M146 146 L160 170 L132 176 L120 167 Z" fill="#4595ca" stroke="#05070c" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="120.5" cy="182" r="2.3" fill="#f8fafc" stroke="#05070c" stroke-width="1.2"/>
  <path d="M142 178 L166 178 L166 202 L154 207 L142 202 Z" fill="#1e5885" stroke="#05070c" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="147" y="171" width="14" height="11" rx="2.5" fill="#090d14" stroke="#05070c" stroke-width="2"/>

