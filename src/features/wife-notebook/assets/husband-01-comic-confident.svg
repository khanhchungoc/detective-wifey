    <linearGradient id="hair-noir" x1="90" y1="34" x2="148" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27364f"/>
      <stop offset="35%" stop-color="#0f1522"/>
