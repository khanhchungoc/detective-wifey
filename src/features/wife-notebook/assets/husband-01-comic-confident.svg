<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="shirt-lit" x1="120" y1="146" x2="120" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5bb2e6"/>
      <stop offset="52%" stop-color="#2f7db3"/>
      <stop offset="100%" stop-color="#143a59"/>
    </linearGradient>
    <linearGradient id="skin-noir" x1="120" y1="54" x2="120" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eab38f"/>
