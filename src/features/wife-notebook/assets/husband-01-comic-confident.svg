  <!-- Cold Steel Interrogation Table Foreground -->
  <rect x="10" y="216" width="220" height="24" fill="url(#table-steel)"/>
  <line x1="10" y1="216" x2="230" y2="216" stroke="#94a3b8" stroke-width="2" opacity="0.7"/>
